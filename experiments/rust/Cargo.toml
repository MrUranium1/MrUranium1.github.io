[package]
name = "rust_page"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Node", "EventTarget", "HtmlCanvasElement", "CanvasRenderingContext2d", "ImageData"] }

[profile.release]
opt-level = 3
lto = true
