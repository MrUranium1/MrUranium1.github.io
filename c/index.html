<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>C · Mehir</title>
<style>
body{margin:0;background:#050605;color:#c8d0c8;font:15px/1.6 ui-monospace,"IBM Plex Mono",Menlo,Consolas,monospace}
.top{display:flex;gap:18px;padding:16px 24px;font-size:13px;border-bottom:1px solid #1a211a}
.top a{color:#5c6b5c;text-decoration:none}.top a.on,.top a:hover{color:#39ff6a}
#app{max-width:820px;margin:0 auto;padding:40px 24px 80px}
h1{font-size:clamp(72px,16vw,150px);margin:0;line-height:1;color:#39ff6a;letter-spacing:-.06em;text-shadow:0 0 24px rgba(57,255,106,.35)}
.tag{color:#6f806f;max-width:560px}
canvas{display:block;width:100%;max-width:640px;aspect-ratio:16/9;image-rendering:pixelated;border:1px solid #1f2b1f;margin:20px 0}
.sec{margin-top:44px}
.sec h2{font-size:13px;font-weight:400;color:#39ff6a;border-bottom:1px dashed #1f2b1f;padding-bottom:8px}
.sec h2::before{content:"#include <"}.sec h2::after{content:".h>"}
.item{display:block;padding:10px 0;color:inherit;text-decoration:none}
.item::before{content:"-> ";color:#39ff6a}.item b{color:#fff;font-weight:400}.item p{margin:0 0 0 3ch;color:#6f806f}
.item:hover b{background:#39ff6a;color:#000}.empty{color:#3d4a3d}
</style></head><body>
<nav class="top"><a href="../">~</a><a href="../rust/">rust</a><a href="../ruby/">ruby</a><a href="../python/">python</a><a href="../java/">java</a><a href="../c/" class="on">c</a></nav>
<main id="app"><p class="empty">/* loading page.wasm */</p></main>
<script>
fetch("page.wasm").then(r=>r.arrayBuffer()).then(b=>WebAssembly.instantiate(b)).then(({instance:i})=>{
  const x=i.exports, W=320, H=180;
  const str=p=>{const m=new Uint8Array(x.memory.buffer);let e=p;while(m[e])e++;return new TextDecoder().decode(m.subarray(p,e))};
  document.getElementById("app").innerHTML=str(x.page());
  const g=document.getElementById("fb").getContext("2d");
  const loop=t=>{const p=x.frame(t/1000);
    g.putImageData(new ImageData(new Uint8ClampedArray(x.memory.buffer,p,W*H*4).slice(),W,H),0,0);
    requestAnimationFrame(loop)};
  requestAnimationFrame(loop);
});
</script></body></html>
