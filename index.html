<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mehir’s notebook</title>
<meta name="description" content="A handwritten digital notebook: thoughts, fragments and writings.">
<meta property="og:title" content="Mehir’s notebook">
<meta property="og:description" content="A handwritten digital notebook.">
<meta property="og:url" content="https://mehir.is-a.dev/">
<meta name="theme-color" content="#2a211b">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="desk">
  <div class="book" id="book" aria-live="polite"><div class="stack"></div></div>
  <nav class="bar" aria-label="Notebook controls">
    <button id="prev" type="button">‹ back</button>
    <button id="toc" type="button">contents</button>
    <span id="where" aria-live="polite"></span>
    <button id="next" type="button">next ›</button>
  </nav>
  <noscript><p class="ns">This notebook needs JavaScript to turn its pages.</p></noscript>
</main>
<script src="app.js"></script>
</body>
</html>
