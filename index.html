<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Name</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0a0a0b;--fg:#f2f2f0;--dim:#7c7c80;--line:#222226;--glow:rgba(120,140,255,.14)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f6f3;--fg:#111113;--dim:#85858a;--line:#deded9;--glow:rgba(90,110,255,.12)}}
:root[data-theme="light"]{--bg:#f6f6f3;--fg:#111113;--dim:#85858a;--line:#deded9;--glow:rgba(90,110,255,.12)}
:root[data-theme="dark"]{--bg:#0a0a0b;--fg:#f2f2f0;--dim:#7c7c80;--line:#222226;--glow:rgba(120,140,255,.14)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;overflow:hidden;transition:background .4s,color .4s}
#glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(500px circle at var(--x,50%) var(--y,40%),var(--glow),transparent 70%)}
main{position:relative;height:100%;max-width:880px;margin:0 auto;padding:32px 28px;display:flex;flex-direction:column;justify-content:space-between}
header,footer{display:flex;justify-content:space-between;align-items:center;font:12px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--dim);letter-spacing:.04em}
#theme{all:unset;cursor:pointer;width:14px;height:14px;border-radius:50%;border:1.5px solid var(--fg);background:linear-gradient(90deg,var(--fg) 50%,transparent 50%);transition:transform .3s}
#theme:hover{transform:rotate(180deg)}
h1{font-size:clamp(44px,10vw,104px);line-height:1;font-weight:600;letter-spacing:-.045em;margin:0 0 20px}
.role{font-size:clamp(18px,3vw,26px);color:var(--dim);margin:0;min-height:1.6em}
.role b{color:var(--fg);font-weight:500;border-right:2px solid var(--fg);padding-right:3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{border-color:transparent}}
.bio{max-width:460px;color:var(--dim);margin:22px 0 0}
nav{display:flex;flex-wrap:wrap;gap:6px 26px;margin-top:34px}
nav a{color:var(--fg);text-decoration:none;position:relative;padding:2px 0}
nav a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:100%;background:var(--fg);transform:scaleX(0);transform-origin:left;transition:transform .3s}
nav a:hover::after{transform:scaleX(1)}
nav a span{color:var(--dim);margin-left:4px;display:inline-block;transition:transform .3s}
nav a:hover span{transform:translate(2px,-2px)}
.rise{opacity:0;transform:translateY(14px);animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.rise{animation:none;opacity:1;transform:none}.role b{animation:none}}
</style>
</head>
<body>
<div id="glow"></div>
<main>
  <header><span id="domain"></span><button id="theme" aria-label="Toggle theme"></button></header>
  <section>
    <h1 class="rise" id="name"></h1>
    <p class="role rise" style="animation-delay:.15s"><span id="pre"></span> <b id="w"></b></p>
    <p class="bio rise" id="bio" style="animation-delay:.3s"></p>
    <nav class="rise" id="links" style="animation-delay:.45s"></nav>
  </section>
  <footer><span id="clock"></span><span id="copy"></span></footer>
</main>
<script src="config.js"></script>
<script>
const S=window.SITE;
document.title=S.name;
document.getElementById("domain").textContent=S.domain;
document.getElementById("name").textContent=S.name+".";
document.getElementById("pre").textContent=S.rolePrefix;
document.getElementById("bio").textContent=S.bio;
document.getElementById("copy").textContent="© "+new Date().getFullYear()+" "+S.name;
S.links.forEach(l=>{const a=document.createElement("a");a.href=l.url;a.textContent=l.label;
  if(!l.url.startsWith("mailto:")){a.target="_blank";a.rel="noopener"}
  const s=document.createElement("span");s.textContent="↗";a.appendChild(s);document.getElementById("links").appendChild(a)});
if(S.theme==="dark"||S.theme==="light")document.documentElement.dataset.theme=S.theme;
const words=S.roles;
let wi=0,ci=0,del=false;const w=document.getElementById("w");
(function type(){const t=words[wi];w.textContent=t.slice(0,ci);
  if(!del&&ci===t.length){del=true;return setTimeout(type,1400)}
  if(del&&ci===0){del=false;wi=(wi+1)%words.length}
  ci+=del?-1:1;setTimeout(type,del?45:90)})();
function tick(){document.getElementById("clock").textContent=S.city+" · "+new Date().toLocaleTimeString("en-GB",{timeZone:S.timezone,hour:"2-digit",minute:"2-digit"})}
tick();setInterval(tick,30000);
const g=document.getElementById("glow");
addEventListener("pointermove",e=>{g.style.setProperty("--x",e.clientX+"px");g.style.setProperty("--y",e.clientY+"px")});
document.getElementById("theme").onclick=()=>{
  const r=document.documentElement,cur=r.dataset.theme||(matchMedia("(prefers-color-scheme:light)").matches?"light":"dark");
  r.dataset.theme=cur==="dark"?"light":"dark"};
</script>
</body>
</html>
